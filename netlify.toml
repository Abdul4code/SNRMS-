# Netlify build config for the SNRMS Vue frontend.
# The repo root is the Netlify "base" only for context; the app lives in ./frontend.

[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"            # relative to base -> frontend/dist

[build.environment]
  NODE_VERSION = "22"
  # VITE_API_BASE_URL is set in the Netlify UI (Site settings > Environment variables)
  # so you can change the backend URL without editing the repo. Example value:
  #   https://api.your-backend-domain.com/api/

# SPA fallback: let Vue Router handle deep links / page refreshes.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
